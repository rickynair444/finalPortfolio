<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> AI Technology Overview </title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    
</head>
<body>
    <header>
        <h1> Welcome to AI Technology Overview </h1>
        <div class="nav-box">
            <nav>
                <ul>
                    <li><a href="index.html"> Home </a></li>
                    <li><a href="writingAI.html"> Writing AI </a></li>
                    <li><a href="imageAI.html"> Image AI </a></li>
                    <li><a href="musicAI.html"> Music AI </a></li>
                    <li><a href="chatbotsAI.html"> Chatbots AI </a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div id="main-content" class="d-flex align-items-center">
            <img src="aiTools.webp" alt="AI tools" class="content-image me-3">
            <p> Explore the fascinating world of Artificial Intelligence and its applications in writing, image generation, music creation, chatbots, and more! </p>
            <img src="writingAI.jpg" alt="Writing AI tools" class="content-image ms-3">
        </div>
        
        <section id="contact" class="mt-5">
            <h2> Want to chat? </h2>
            <form class="row g-3">
                <div class="col-md-6">
                    <label for="inputName" class="form-label"> Name </label>
                    <input type="text" class="form-control" id="inputName" placeholder="Enter your name" required>
                </div>
                <div class="col-md-6">
                    <label for="inputEmail" class="form-label"> Email </label>
                    <input type="email" class="form-control" id="inputEmail" placeholder="Enter your email" required>
                </div>
                <div class="col-12">
                    <label for="inputMessage" class="form-label"> Message </label>
                    <textarea class="form-control" id="inputMessage" rows="4" placeholder="Enter your message" required></textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary"> Submit </button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p> &copy; 2025 AI Technology Overview </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="javajava.js"></script>
</body>
</html>
